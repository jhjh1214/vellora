# cargo-about configuration for THIRD_PARTY_LICENSES (see third_party/README.md).
# The accepted list mirrors `[licenses] allow` in deny.toml; cargo-deny is the gate, this file only
# has to cover what cargo-deny lets through.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }
