# The corpus subset the text comparison runs on (M1 task 14c): documents whose extracted text the
# engine and Poppler's `pdftotext` agree on, within 2%, over the first 10 pages (at most 6,000
# characters, white space ignored, ligatures expanded). Every entry is a verbatim copy of its entry in
# manifest.toml.
#
# How it was chosen: `VELLORA_TEXT_SURVEY=1 cargo test -p vellora-engine --test text_compare -- --ignored
# --nocapture` measures every document of manifest.toml; 70 of the 275 have at least 30 characters to
# compare (most are image, graphics or annotation test files without text). 42 of those agree within 2%;
# this file lists them all except that of the 13 near-identical veraPDF PDF/UA templates only two (one
# per text length) are kept. So the subset is chosen by agreement, and the 28 measured documents that
# differ are not in it: see docs/milestones/M1.md (Task 14c) for what they are.
# Fetch it with: cargo xtask corpus fetch --manifest tests/corpus/text-manifest.toml
