name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  rust:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # qpdf is the test oracle (`qpdf --check` on every writer output).
      - name: Install qpdf
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y qpdf ;;
            macOS) brew install qpdf ;;
            Windows) choco install qpdf --no-progress -y ;;
          esac
      - name: qpdf version
        run: qpdf --version
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # Invariant harness (tests/invariants) on the small committed corpus subset.
      - name: Fetch the CI corpus subset
        run: cargo xtask corpus fetch --manifest tests/corpus/ci-manifest.toml
      - name: Writer invariants on the CI corpus subset
        run: cargo test --locked -p vellora-invariants -- --ignored --nocapture

  fuzz:
    name: fuzz smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [lexer, object_parser, xref_open, write_roundtrip]
    runs-on: ubuntu-latest
    env:
      # `-D warnings` is for our own builds; the nightly compiler and cargo-fuzz bring their own flags.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # cargo-fuzz needs the nightly toolchain; only this job uses it.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # The CI corpus subset seeds the run: real files reach much deeper than random bytes.
      - name: Fetch seed corpus
        run: cargo +stable xtask corpus fetch --manifest tests/corpus/ci-manifest.toml
      - name: Fuzz ${{ matrix.target }} for 60 s
        working-directory: fuzz
        run: >
          cargo +nightly fuzz run ${{ matrix.target }} --
          "$GITHUB_WORKSPACE/tests/corpus-data" -max_total_time=60 -timeout=20
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  dco:
    name: DCO sign-off
    # Every commit in a PR must carry a Signed-off-by line (CONTRIBUTING.md).
    # On pushes to main the job is skipped (main only receives squash merges).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $c is missing a 'Signed-off-by:' line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
