name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  rust:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # qpdf is the test oracle (`qpdf --check` on every writer output).
      - name: Install qpdf
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y qpdf ;;
            macOS) brew install qpdf ;;
            Windows) choco install qpdf --no-progress -y ;;
          esac
      - name: qpdf version
        run: qpdf --version
      # PDFium (pinned in third_party/pdfium.lock) is loaded at run time by the vellora-render tests.
      - name: Fetch PDFium
        run: cargo xtask pdfium fetch
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # Invariant harness (tests/invariants) on the small committed corpus subset.
      - name: Fetch the CI corpus subset
        run: cargo xtask corpus fetch --manifest tests/corpus/ci-manifest.toml
      - name: Writer invariants on the CI corpus subset
        run: cargo test --locked -p vellora-invariants -- --ignored --nocapture

  fuzz:
    name: fuzz smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [lexer, object_parser, xref_open, write_roundtrip]
    runs-on: ubuntu-latest
    env:
      # `-D warnings` is for our own builds; the nightly compiler and cargo-fuzz bring their own flags.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # cargo-fuzz needs the nightly toolchain; only this job uses it.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # The CI corpus subset seeds the run: real files reach much deeper than random bytes.
      - name: Fetch seed corpus
        run: cargo +stable xtask corpus fetch --manifest tests/corpus/ci-manifest.toml
      - name: Fuzz ${{ matrix.target }} for 60 s
        working-directory: fuzz
        run: >
          cargo +nightly fuzz run ${{ matrix.target }} --
          "$GITHUB_WORKSPACE/tests/corpus-data" -max_total_time=60 -timeout=20
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  cpp-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: formatting differs between clang-format releases.
      - run: pip install clang-format==23.1.3
      - name: clang-format --dry-run -Werror
        run: find app -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run -Werror

  app:
    name: Qt app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is pinned: Qt 6.8.3 links the AGL framework, which the macOS 26 SDK (macos-latest
        # since 2026) no longer has. Move to a newer Qt patch release, then to macos-latest.
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          # `qsb`, which compiles the canvas shaders.
          modules: qtshadertools
          cache: true
      # Qt's platform plugins and OpenGL/xkb libraries on the bare Linux runner, plus an X server
      # with Mesa's software OpenGL for the test that draws (QRhi needs a real platform plugin).
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev
          libxkbcommon-dev libxkbcommon-x11-0 libegl1 libfontconfig1 libdbus-1-3 xvfb
          libgl1-mesa-dri libglx-mesa0 libxcb-cursor0 libxcb-icccm4 libxcb-image0
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
          libxcb-xkb1
      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      # MSVC environment for cmake, Ninja and the cc crate (Rust's C++ glue).
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # PDFium is staged next to the engine; the tests render with the real engine.
      - name: Fetch PDFium
        run: cargo xtask pdfium fetch
      - name: Configure
        run: >
          cmake -S app -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
        shell: bash
      - run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  dco:
    name: DCO sign-off
    # Every commit in a PR must carry a Signed-off-by line (CONTRIBUTING.md).
    # On pushes to main the job is skipped (main only receives squash merges).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $c is missing a 'Signed-off-by:' line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
