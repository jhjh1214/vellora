name: Nightly

# Long-running checks that are too slow for every pull request: the invariant harness over the
# whole corpus, the performance gate, and 30 minutes of fuzzing per target. It also builds the
# installable packages (packaging.yml) and publishes them to the rolling `nightly` pre-release.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "all, or packaging to run just the packaging jobs and publish the nightly pre-release"
        type: choice
        options: [all, packaging]
        default: all

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  corpus:
    if: ${{ inputs.only != 'packaging' }}
    name: invariants on the full corpus
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: qpdf --version
      - name: Fetch the full corpus
        run: cargo xtask corpus fetch
      - name: Writer invariants on the full corpus
        run: cargo test --locked -p vellora-invariants -- --ignored --nocapture

  # The performance gate: the engine on each OS against the last good revision (bench.yml).
  bench:
    if: ${{ inputs.only != 'packaging' }}
    name: benchmarks
    uses: ./.github/workflows/bench.yml

  corpus-gates:
    if: ${{ inputs.only != 'packaging' }}
    name: corpus gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install qpdf
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y qpdf ;;
            macOS) brew install qpdf ;;
            Windows) choco install qpdf --no-progress -y ;;
          esac
      - name: Fetch PDFium and the full corpus
        run: |
          cargo xtask pdfium fetch
          cargo xtask corpus fetch
      # Every corpus document through the real engine (open, password path, first tile).
      - name: Engine corpus gate
        run: cargo test --locked -p vellora-engine --test corpus --release -- --ignored --nocapture
      # The engine's report against the CLI on 20 corpus documents.
      - name: Engine report against the CLI
        run: cargo test --locked -p vellora-engine --test summary --release -- --ignored --nocapture
      - name: cos corpus tests
        run: cargo test --locked -p vellora-cos --release -- --ignored --nocapture
      - name: inspect corpus test
        run: cargo test --locked -p vellora-inspect --test corpus --release -- --ignored --nocapture

  fuzz:
    if: ${{ inputs.only != 'packaging' }}
    name: fuzz 30 min (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [lexer, object_parser, xref_open, write_roundtrip]
    runs-on: ubuntu-latest
    env:
      # `-D warnings` is for our own builds; the nightly compiler and cargo-fuzz bring their own flags.
      RUSTFLAGS: ""
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # Keep the grown corpus from night to night.
      - uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fetch seed corpus
        run: cargo +stable xtask corpus fetch
      - name: Fuzz ${{ matrix.target }} for 30 min
        working-directory: fuzz
        run: >
          cargo +nightly fuzz run ${{ matrix.target }} --
          "$GITHUB_WORKSPACE/tests/corpus-data" -max_total_time=1800 -timeout=20
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # The packages, each smoke-tested, with the SHA-256 sums and the SBOM (packaging.yml).
  packaging:
    name: packages
    uses: ./.github/workflows/packaging.yml

  # The rolling `nightly` pre-release, recreated each night so it never holds stale files. Only the
  # scheduled run and a manual run on main publish. The packages are unsigned (README decision 1).
  publish:
    name: publish the nightly pre-release
    needs: [packaging]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Recreate the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "Unsigned builds of ${GITHUB_SHA::12} for testers (Windows MSI, Linux Flatpak, macOS dmg), with SHA256SUMS and the CycloneDX SBOM. Rebuilt every night; not for production use."
