name: Packaging

# The installable artifacts, each built and smoke-tested (install or extract, then
# `vellora --diagnostics-script scroll-zoom` on a fixture must exit 0). Runs on pull requests that
# touch packaging, so a change shows its result before merging, and is called by `nightly.yml`,
# which publishes the artifacts. Nightly builds are unsigned (docs/milestones/README.md, decision 1).

on:
  pull_request:
    paths:
      - ".github/workflows/packaging.yml"
      - "packaging/**"
      - "app/CMakeLists.txt"
      - "THIRD_PARTY_LICENSES"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The MSI is built with the last WiX release that has no maintenance-fee terms; it is a build
  # tool only and is not shipped.
  WIX_VERSION: 5.0.2

jobs:
  windows:
    name: Windows MSI
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          modules: qtshadertools
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch PDFium
        run: cargo xtask pdfium fetch
      - name: Configure (Release)
        shell: bash
        run: cmake -S app -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      # Not in bash: Git's `link.exe` would shadow MSVC's.
      - name: Build the app
        run: cmake --build build --target vellora
      - name: Stage the files and deploy Qt
        run: pwsh packaging/windows/stage.ps1 -BuildDir build -Stage dist/stage
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add --global "WixToolset.UI.wixext/$env:WIX_VERSION"
      - name: Build the MSI
        run: |
          # The workspace version plus the run number: Windows Installer upgrades by version.
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?ms)\[workspace\.package\][^\[]*?^version = "(\d+\.\d+\.\d+)"') { throw 'no workspace version' }
          $version = "$($Matches[1]).$($env:GITHUB_RUN_NUMBER % 65535)"
          # Qt's licence dialog wants RTF: plain text, escaped.
          $text = (Get-Content LICENSE -Raw) -replace '\\', '\\' -replace '\{', '\{' -replace '\}', '\}'
          $text = [regex]::Replace($text, '[^\x00-\x7F]', { param($m) '\u' + [int][char]$m.Value + '?' })
          $rtf = '{\rtf1\ansi\deff0{\fonttbl{\f0 Courier New;}}\f0\fs18 ' + ($text -replace "`r?`n", "\par`r`n") + '}'
          Set-Content -Encoding ascii dist/license.rtf $rtf
          $here = (Get-Location).Path
          wix build packaging/windows/vellora.wxs -arch x64 -ext WixToolset.UI.wixext `
            -d "Version=$version" -d "StageDir=$here\dist\stage" -d "LicenseRtf=$here\dist\license.rtf" `
            -o "dist/Vellora-$version-x64.msi"
          if ($LASTEXITCODE -ne 0) { wix build -?; throw 'wix build failed' }
      - name: Smoke test (install, run, association, uninstall)
        run: |
          $msi = (Get-ChildItem dist/Vellora-*-x64.msi).FullName
          pwsh packaging/windows/smoke.ps1 -Msi $msi -Fixture crates/engine/tests/fixtures/golden.pdf
          if ($LASTEXITCODE -ne 0) { throw 'smoke test failed' }
      - name: Windows Installer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-logs
          path: dist/msi-logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: vellora-windows-x64-msi
          path: dist/Vellora-*-x64.msi
          if-no-files-found: error

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install flatpak-builder and the X server for the smoke test
        run: >
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder xvfb dbus-x11
      # Ubuntu 24.04 blocks unprivileged user namespaces, which Flatpak's sandbox needs.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Add Flathub
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the Flatpak
        run: >
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse
          --repo=dist/repo dist/build packaging/flatpak/io.github.jhjh1214.Vellora.yml
      - name: Bundle
        run: flatpak build-bundle dist/repo dist/Vellora-x86_64.flatpak io.github.jhjh1214.Vellora
      # The probe is built on the host and run inside the sandbox by the smoke test.
      - name: Build the engine sandbox probe
        run: cargo build --locked --release -p vellora-engine --example engine_sandbox_probe
      - name: Smoke test (run and probe the engine sandbox inside the Flatpak)
        run: >
          sh packaging/flatpak/smoke.sh dist/Vellora-x86_64.flatpak
          crates/engine/tests/fixtures/golden.pdf target/release/examples/engine_sandbox_probe
      - uses: actions/upload-artifact@v4
        with:
          name: vellora-linux-x86_64-flatpak
          path: dist/Vellora-x86_64.flatpak
          if-no-files-found: error

  macos:
    name: macOS dmg
    # Pinned like the Qt app job in ci.yml: Qt 6.8.3 links the AGL framework, which the macOS 26 SDK
    # no longer has.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          modules: qtshadertools
          cache: true
      - run: brew install ninja
      - name: Fetch PDFium
        run: cargo xtask pdfium fetch
      - name: Build the app (Release)
        run: |
          cmake -S app -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --target vellora
      - name: Assemble the bundle and the disk image
        run: |
          version=$(sed -nE '/^\[workspace\.package\]/,/^\[/ s/^version = "([0-9.]+)"/\1/p' Cargo.toml | head -1)
          sh packaging/macos/stage.sh build "$version" dist
      - name: Smoke test (mount, copy out, run)
        run: sh packaging/macos/smoke.sh dist/Vellora-*-macos-arm64.dmg crates/engine/tests/fixtures/golden.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: vellora-macos-arm64-dmg
          path: dist/Vellora-*-macos-arm64.dmg
          if-no-files-found: error

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A build tool only; pinned so that the SBOM does not change with the tool.
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate the CycloneDX documents of the Rust crates
        run: cargo cyclonedx --format json --spec-version 1.5
      - name: Merge them and add PDFium and Qt
        run: >
          python3 packaging/sbom/merge.py --cyclonedx-dir .
          --pdfium-lock third_party/pdfium.lock --qt-version 6.8.3
          --version "$(sed -nE '/^\[workspace\.package\]/,/^\[/ s/^version = "([0-9.]+)"/\1/p' Cargo.toml | head -1)"
          --out vellora.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: vellora-sbom
          path: vellora.cdx.json
          if-no-files-found: error

  # Everything a release page carries, in one artifact, with the SHA-256 sums of all of it.
  release-files:
    name: checksums
    needs: [windows, flatpak, macos, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "vellora-*"
          path: dist
          merge-multiple: true
      - name: SHA-256 sums
        working-directory: dist
        run: |
          ls -l
          sha256sum -- * | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
