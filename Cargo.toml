[workspace]
resolver = "3"
members = [
    "crates/cos",
    "crates/inspect",
    "crates/render",
    "crates/ipc",
    "crates/engine",
    "crates/engine-client",
    "crates/cli",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/jhjh1214/vellora"
homepage = "https://github.com/jhjh1214/vellora"
authors = ["The Vellora Contributors"]
# Not published until the maintainer decides on crates.io name reservation.
publish = false

[workspace.dependencies]
# Internal crates. Add external dependencies here (with a version) so every
# member uses the same version; each must pass `cargo deny check`.
vellora-cos = { path = "crates/cos" }
vellora-inspect = { path = "crates/inspect" }
vellora-render = { path = "crates/render" }
vellora-ipc = { path = "crates/ipc" }
vellora-engine-client = { path = "crates/engine-client" }

# External. Small, well-maintained crates, all permissive.
thiserror = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Untrusted input must never panic (CLAUDE.md invariant 5).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
# Pedantic lints that cost more than they give.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind" # engine catches panics at the job boundary and reports them
debug = "line-tables-only"
