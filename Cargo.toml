[workspace]
resolver = "3"
members = [
    "crates/cos",
    "crates/inspect",
    "crates/render",
    "crates/ipc",
    "crates/shm",
    "crates/engine",
    "crates/engine-client",
    "crates/cli",
    "xtask",
    "tests/invariants",
    "bench",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/jhjh1214/vellora"
homepage = "https://github.com/jhjh1214/vellora"
authors = ["The Vellora Contributors"]
# Not published until the maintainer decides on crates.io name reservation.
publish = false

[workspace.dependencies]
# Internal crates. Add external dependencies here (with a version) so every
# member uses the same version; each must pass `cargo deny check`.
vellora-cos = { path = "crates/cos" }
vellora-inspect = { path = "crates/inspect" }
vellora-render = { path = "crates/render" }
vellora-ipc = { path = "crates/ipc" }
vellora-shm = { path = "crates/shm" }
vellora-engine = { path = "crates/engine" }
vellora-engine-client = { path = "crates/engine-client" }

# External. Small, well-maintained crates, all permissive.
thiserror = "2"
# Pure-Rust (miniz_oxide) backend: no C zlib, no unsafe in our tree.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
# Wire format of the UI/engine protocol (ADR-0005). `use-std` only (no heapless, no alloc-only extras); it still pulls in `cobs` and `embedded-io`.
postcard = { version = "1", default-features = false, features = ["use-std"] }
sha2 = "0.10"
# Standard Security Handler (RustCrypto, one release line: digest 0.10 / cipher 0.4).
md-5 = "0.10"
aes = "0.8"
cbc = "0.1"
toml = "0.9"
# Runtime loading of the PDFium shared library (ISC; `vellora-render` only, see ADR-0014).
libloading = "0.9"
# `vellora-shm` only (ADR-0015): memory mapping, the anonymous backing file of the tile region, and the
# two platform APIs behind handle passing.
memmap2 = "0.9"
tempfile = "3"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
# Engine host: logging (stderr only; nothing is ever sent anywhere) and error context in `main`.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
anyhow = "1"
# `vellora-engine-client` only (ADR-0003): the C++ bridge to the Qt shell, and the build script that
# generates its header and glue.
cxx = "1"
cxx-build = "1"
# `vellora-cli`: argument parsing (derive, no colour or suggestions), the JSON report, and snapshot tests of it.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde_json = "1"
insta = { version = "1", default-features = false }
# Reads and writes the golden images of the render tests (dev-dependency of `vellora-render`).
png = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Untrusted input must never panic (CLAUDE.md invariant 5).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
# Pedantic lints that cost more than they give.
module_name_repetitions = "allow"
must_use_candidate = "allow"

# The revision 6 password check hashes for hundreds of rounds; unoptimised that makes tests that open
# many encrypted files take minutes. Build the crypto crates with optimisations in dev and test.
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.cbc]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind" # engine catches panics at the job boundary and reports them
debug = "line-tables-only"
