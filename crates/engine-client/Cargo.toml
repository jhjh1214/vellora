[package]
name = "vellora-engine-client"
description = "Client library linked into the Vellora Qt shell: engine IPC, tile cache and the cxx bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "vellora_engine_client"
# The Qt shell links the staticlib; the engine's tests and other Rust code use the rlib.
crate-type = ["staticlib", "rlib"]

[dependencies]
# `LaunchArgs` and `Deadlines`: the client builds the command line with the type the engine parses.
vellora-engine = { workspace = true }
vellora-ipc = { workspace = true }
vellora-shm = { workspace = true }
thiserror = { workspace = true }
cxx = { workspace = true }

[build-dependencies]
cxx-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Job object (memory limit, kill-on-close, no child processes) and AppContainer launch for the engine process.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Console", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem"] }

# FFI crate (cxx bridge): `unsafe` is denied by default and allowed only where
# documented, with a `// SAFETY:` comment on every block (CLAUDE.md invariant 6).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
