[package]
name = "vellora-engine-client"
description = "Client library linked into the Vellora Qt shell: engine IPC, tile cache and the cxx bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "vellora_engine_client"
# M0 task 20 adds crate-type = ["staticlib", "rlib"] together with the cxx bridge.

[dependencies]

# FFI crate (cxx bridge): `unsafe` is denied by default and allowed only where
# documented, with a `// SAFETY:` comment on every block (CLAUDE.md invariant 6).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
