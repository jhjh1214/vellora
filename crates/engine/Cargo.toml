[package]
name = "vellora-engine"
description = "Vellora engine host: sandboxed per-document process that parses and renders PDFs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "vellora_engine"

[[bin]]
name = "vellora-engine"
path = "src/main.rs"

[dependencies]
vellora-cos = { workspace = true }
vellora-ipc = { workspace = true }
vellora-render = { workspace = true }
vellora-shm = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# Starts the engine under resource limits (`tests/limits.rs`). A dev-dependency cycle: the client
# depends on this crate's library for `LaunchArgs`, and the binary under test lives here.
vellora-engine-client = { workspace = true }
png = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
